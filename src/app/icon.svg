<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cream background -->
  <rect width="32" height="32" fill="#EDE6D8"/>
  <!-- Border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#1E1A16" stroke-width="1.5"/>
  <!-- Pixel-art "S" in rose — 5×7 grid, 3px/cell, centered -->
  <!-- Row 0: .XXX. -->
  <rect x="11" y="5" width="9" height="3" fill="#A87060"/>
  <!-- Row 1: X.... -->
  <rect x="8" y="8" width="3" height="3" fill="#A87060"/>
  <!-- Row 2: X.... -->
  <rect x="8" y="11" width="3" height="3" fill="#A87060"/>
  <!-- Row 3: .XXX. -->
  <rect x="11" y="14" width="9" height="3" fill="#A87060"/>
  <!-- Row 4: ....X -->
  <rect x="20" y="17" width="3" height="3" fill="#A87060"/>
  <!-- Row 5: ....X -->
  <rect x="20" y="20" width="3" height="3" fill="#A87060"/>
  <!-- Row 6: .XXX. -->
  <rect x="11" y="23" width="9" height="3" fill="#A87060"/>
</svg>
